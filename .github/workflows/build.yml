name: Build ovPilot
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libasound2-dev libssl-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
      - run: cargo build --release
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: installer
        run: |
          & 'C:\Program Files (x86)\NSIS\makensis.exe' '/DSOURCE_EXE=..\target\release\ovPilot.exe' 'ovPilot.nsi'
      - uses: actions/upload-artifact@v4
        with:
          name: ovPilot-${{ runner.os }}
          path: |
            target/release/ovPilot.exe
            target/release/ovPilot
            installer/ovPilot-Setup-1.0.0.exe
            data/aircraft_types-LICENSE
            target/doc/
