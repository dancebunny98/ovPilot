name: Build ovPilot
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libasound2-dev libssl-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
      - run: cargo build --release
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          for ($attempt = 1; $attempt -le 3 -and -not (Test-Path $makensis); $attempt++) {
            choco install nsis --yes --no-progress
            if (-not (Test-Path $makensis)) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not (Test-Path $makensis)) { throw 'NSIS could not be installed after three attempts.' }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: installer
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'ovpilot' | Select-Object -First 1).version
          & 'C:\Program Files (x86)\NSIS\makensis.exe' "/DPRODUCT_VERSION=$version" '/DSOURCE_EXE=..\target\release\ovPilot.exe' 'ovPilot.nsi'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ovPilot-${{ runner.os }}
          path: |
            target/release/ovPilot.exe
            target/release/ovPilot
            installer/ovPilot-Setup-*.exe
            data/aircraft_types-LICENSE
            target/doc/
